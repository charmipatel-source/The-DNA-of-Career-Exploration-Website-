<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Industry Training | The DNA of Career Exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&family=Pinyon+Script&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<style>
  .tr-viewport { justify-content: flex-start; gap: 1.2rem; }
  .tr-head { text-align: center; margin-top: 1.2rem; }
  .tr-head .glitch-title { font-size: 1.8rem; margin-bottom: .5rem; }
  .tr-stage { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1.1rem; width: 100%; max-width: 900px; margin: 0 auto; animation: fadeIn .35s ease; position: relative; z-index: 20; }
  .tr-hidden { display: none !important; }

  /* DNA zoom ladder (steps 3 & 4) */
  .ladder { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: .6rem 0; width: 100%; }
  .rung { display: flex; align-items: center; height: 26px; }
  .rung i { width: 26px; height: 26px; border-radius: 50%; background: #1e3a6e; }
  .rung i:last-child { background: #4a2260; }
  .rung b { height: 8px; background: #3b3f55; flex: 1; }
  .rung.active i:first-child { background: #4fb0cf; box-shadow: 0 0 14px #4fb0cf; }
  .rung.active i:last-child { background: var(--pink-exp); box-shadow: 0 0 14px var(--pink-glow); }
  .rung.active b { background: #84b69a; }
  .step-tag { font-family: var(--font-retro); font-size: .62rem; letter-spacing: 1px; border: 2px solid #fff; border-radius: 30px; padding: .55rem 1.4rem; background: #080b1e; }

  /* base pair */
  .pair { display: flex; align-items: center; gap: 1rem; width: 100%; max-width: 760px; justify-content: center; }
  .base { width: 70px; height: 70px; display: grid; place-items: center; font-family: var(--font-retro); font-size: 1.1rem; color: #fff; flex: none; border-radius: 8px; }
  .base.pink { background: var(--pink-exp); box-shadow: 0 0 14px var(--pink-glow); } 
  .base.blue { background: #4fb0cf; box-shadow: 0 0 14px #4fb0cf; }
  .bonds { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .bonds span { border-top: 2px dashed #f5d442; }
  .bonds.gc span { border-top-color: #84b69a; }

  .pill-label { font-family: var(--font-retro); font-size: .62rem; letter-spacing: 1px; border: 2px solid #fff; border-radius: 30px; padding: .55rem 1.6rem; width: 100%; max-width: 700px; text-align: center; background: #080b1e; }
  .q-box, .forum-box { width: 100%; border: 2.5px solid var(--card-border); border-radius: 24px; padding: 1.2rem 1.6rem; background: rgba(11,15,39,.88); font-family: var(--font-body); font-size: 1.1rem; line-height: 1.6; font-weight: 600; box-shadow: 0 10px 40px rgba(0,0,0,.9); }
  .forum-box { min-height: 170px; max-height: 240px; overflow-y: auto; font-size: 1rem; }
  .forum-box p { margin-bottom: .45rem; }
  .c1 { color: #4deeea; } .c2 { color: #ff5c6c; } .c3 { color: #9be06a; } .c4 { color: #ffd166; }
  .tr-input { width: 100%; background: #1e3a6e; border: 2px solid #8fb0e0; border-radius: 22px; padding: .85rem 1.2rem; color: #fff; font-family: var(--font-body); font-size: 1.05rem; font-weight: 600; outline: none; resize: vertical; }
  .tr-input:focus { border-color: var(--cyan-primary); box-shadow: 0 0 10px rgba(77,238,234,.45); }
  .tr-input::placeholder { color: #9bb6dc; }
  .tr-row { display: flex; gap: 1rem; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: .4rem; }
  .tr-btn { background: #000; border: 2.5px solid #fff; border-radius: 16px; color: #fff; font-family: var(--font-retro); font-size: .66rem; padding: .85rem 1.4rem; cursor: pointer; letter-spacing: 1.5px; text-decoration: none; transition: all .2s; }
  .tr-btn:hover:not(:disabled) { background: #fff; color: #000; box-shadow: 0 0 18px rgba(255,255,255,.7); transform: translateY(-2px); }
  .tr-btn:disabled { opacity: .4; cursor: not-allowed; }
  .tr-btn:focus-visible, .tr-input:focus-visible { outline: 3px solid var(--cyan-primary); outline-offset: 2px; }
  .feedback { font-family: var(--font-body); font-weight: 700; font-size: 1.05rem; color: #9be06a; text-align: center; max-width: 760px; min-height: 1.4em; }
  .feedback.warn { color: #ffd166; }
  .hint { font-family: var(--font-body); font-size: 1.05rem; color: #82a8de; text-align: center; }

  /* certificate */
  .cert-wrap { width: 100%; max-width: 580px; margin: .5rem 0; }
  .cert { aspect-ratio: 4 / 3; background: #e6e2dc; border: 6px solid #4fb0cf; color: #1b1b1b; position: relative; padding: 5% 8%; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 0 35px rgba(77,238,234,.35); border-radius: 4px; }
  .cert::before, .cert::after { content: '❦'; position: absolute; font-size: 2.2rem; color: #c9bfa8; }
  .cert::before { top: 6px; left: 12px; } .cert::after { bottom: 6px; right: 12px; transform: rotate(180deg); }
  .cert h2 { font-family: 'UnifrakturCook', serif; font-size: clamp(1.6rem, 4.6vw, 2.5rem); line-height: 1.1; }
  .cert .certifies { font-family: 'UnifrakturCook', serif; font-size: clamp(.8rem, 2vw, 1.05rem); border-bottom: 1px solid #555; margin: .5rem 0 .3rem; padding: 0 .8rem .15rem; }
  .cert .name { font-family: 'Pinyon Script', cursive; font-size: clamp(1.7rem, 5vw, 2.8rem); background: none; border: none; border-bottom: 1px dashed #aaa; text-align: center; color: #1b1b1b; width: 80%; outline: none; }
  .cert .small { font-family: 'Pinyon Script', cursive; font-size: clamp(.8rem, 1.8vw, 1rem); margin-top: .3rem; }
  .cert .program { font-family: 'Pinyon Script', cursive; font-size: clamp(1rem, 2.6vw, 1.4rem); font-weight: bold; }
  .cert-foot { margin-top: auto; width: 100%; display: flex; align-items: flex-end; justify-content: space-between; font-family: 'UnifrakturCook', serif; font-size: clamp(.5rem, 1.2vw, .7rem); }
  .cert-foot span { width: 28%; border-top: 1px solid #333; padding-top: 2px; }
  .cert-foot svg { width: 14%; min-width: 44px; }
  .cta { font-family: var(--font-body); font-size: .95rem; font-weight: 600; line-height: 1.8; color: #4deeea; text-align: center; max-width: 640px; }

  @media print {
    body * { visibility: hidden; }
    .cert-wrap, .cert-wrap * { visibility: visible; }
    .cert-wrap { position: fixed; inset: 0; margin: auto; max-width: 9in; }
    .cert .name { border-bottom: none; }
  }
  @media (prefers-reduced-motion: reduce) { .tr-stage { animation: none; } }
</style>
</head>
<body>
<div class="scanlines"></div>
<canvas id="dna-left" class="dna-canvas dna-left"></canvas>
<canvas id="dna-right" class="dna-canvas dna-right"></canvas>

<div class="viewport tr-viewport">
  <header class="tr-head">
    <h1 class="glitch-title" id="tr-title">DNA</h1>
    <p class="sub-title" id="tr-sub">(10,200X)</p>
  </header>

  <main class="tr-stage" id="tr-stage" aria-live="polite"></main>

  <footer class="bottom-bar">
    <div class="role-display-pill">
      <span class="role-label">ROLE:</span>
      <span class="role-value" id="current-role">TAKE THE QUIZ TO MATCH!</span>
    </div>
    <div class="exp-container">
      <div class="exp-track" role="progressbar" aria-label="Experience" aria-valuemin="0" aria-valuemax="100" id="exp-track">
        <div class="exp-fill" id="exp-fill" style="width:15%"></div>
        <span class="exp-label">EXP</span>
      </div>
    </div>
    <div class="action-buttons">
      <button class="action-btn" type="button"><span class="action-icon">📓</span><span>LAB NOTEBOOK</span></button>
      <button class="action-btn" type="button"><span class="action-icon">🤖</span><span>BIO-BOT 9000</span></button>
    </div>
  </footer>
</div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const stage = $('#tr-stage');
  const safeGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const role = safeGet('biotech_matched_role') || 'DNA Analyst';
  $('#current-role').textContent = role.toUpperCase();

  const QUESTIONS = [
    { pair: ['A', 'T'], cls: ['pink', 'blue'], bond: '',
      q: 'Your team made progress on a project, but the initial results aren’t as strong as hoped. The business team wants to tell investors about the progress right away. You are worried they will oversimplify the data and make promises the lab can’t keep. How do you explain the situation so they understand the limits without them losing interest in the project?',
      tip: 'Strong answers share what the data does show, name the limits plainly, and offer a clear next step.' },
    { pair: ['C', 'G'], cls: ['blue', 'pink'], bond: 'gc',
      q: 'You have spent 6 months working on a specific lab process. Suddenly, new safety rules come out that make your current approach unusable. Your manager tells you to continue the experiment and lie about the approach. How should you handle this so you can keep your job and the experiment?',
      tip: 'Safety and honest reporting come first. Strong answers raise the concern, document it, and propose a compliant path forward.' },
    { pair: ['G', 'C'], cls: ['pink', 'blue'], bond: '',
      q: 'You are working on a project with both computer scientists and lab scientists. The computer team wants data delivered quickly so they can test their computer models. The lab team says going faster will ruin the samples and the quality of the test. How do you help these two teams resolve their disagreement?',
      tip: 'Strong answers listen to both goals, find the shared one (reliable data), and propose a compromise such as staged deliveries.' }
  ];

  const STAGES = ['step3', 'q0', 'q1', 'q2', 'forum', 'step4', 'cert'];
  const EXP = [15, 65, 67, 70, 77, 96, 100];
  const answers = [];
  let idx = 0;

  function setHead(t, s) { $('#tr-title').textContent = t; $('#tr-sub').textContent = s; }
  function setExp(p) {
    $('#exp-fill').style.width = p + '%';
    $('#exp-track').setAttribute('aria-valuenow', p);
  }

  function ladder(activeRow, label) {
    let rows = '';
    for (let i = 0; i < 7; i++) {
      const w = [20, 55, 90, 100, 90, 55, 20][i];
      rows += `<div class="rung ${i === activeRow ? 'active' : ''}" style="width:${w}%"><i></i><b></b><i></i></div>`;
    }
    return `<div class="ladder">${rows}</div><div class="step-tag">${label}</div>`;
  }

  function show(html) { stage.style.animation = 'none'; stage.offsetHeight; stage.style.animation = ''; stage.innerHTML = html; }

  function renderStep(n) {
    const isThree = n === 3;
    setHead('DNA', '(10,200X)');
    show(`${ladder(isThree ? 3 : 0, isThree ? 'STEP 3: INDUSTRY TRAINING' : 'STEP 4: CERTIFICATION')}
      <p class="hint">${isThree ? 'Zoom in to the molecular level to practice the soft skills every lab team relies on.' : 'You have completed every training task. Zoom in to claim your certificate.'}</p>
      <div class="tr-row"><a class="tr-btn" href="index.html">HOME</a><button class="tr-btn" id="go" type="button">${isThree ? 'START TRAINING' : 'CLAIM CERTIFICATE'}</button></div>`);
    $('#go').onclick = next;
    $('#go').focus();
  }

  function renderQuestion(n) {
    const d = QUESTIONS[n];
    setHead('MOLECULAR BASE PAIRS', '(1,000,000X)');
    show(`<div class="pair"><div class="base ${d.cls[0]}">${d.pair[0]}</div><div class="bonds ${d.bond}"><span></span><span></span></div><div class="base ${d.cls[1]}">${d.pair[1]}</div></div>
      <div class="pill-label">SOFT SKILL BUILDING &middot; ${n + 1} OF ${QUESTIONS.length}</div>
      <div class="q-box">${n + 1}. ${d.q}</div>
      <textarea class="tr-input" id="ans" rows="3" placeholder="Enter text here (a few sentences)" aria-label="Your answer"></textarea>
      <div class="feedback" id="fb"></div>
      <div class="tr-row"><button class="tr-btn" id="submit" type="button">SUBMIT ANSWER</button><button class="tr-btn tr-hidden" id="cont" type="button">CONTINUE</button></div>`);
    const ans = $('#ans'), fb = $('#fb');
    ans.value = answers[n] || '';
    $('#submit').onclick = () => {
      const v = ans.value.trim();
      if (v.length < 25) { fb.className = 'feedback warn'; fb.textContent = 'Add a little more detail. Aim for at least a full sentence or two.'; return; }
      answers[n] = v;
      safeSet('biotech_training_answers', JSON.stringify(answers));
      fb.className = 'feedback';
      fb.textContent = 'Answer logged! ' + d.tip;
      ans.readOnly = true;
      $('#submit').classList.add('tr-hidden');
      $('#cont').classList.remove('tr-hidden');
      $('#cont').focus();
      setExp(Math.min(EXP[idx] + 8, 95));
    };
    $('#cont').onclick = next;
    ans.focus();
  }

  const POSTS = [
    ['c1', 'Looking for one more partner for the Build the Moon challenge!'],
    ['c2', 'Is PCR a good skill to learn for other pathways?'],
    ['c3', 'Starting a discussion for the ethics of AI in healthcare!']
  ];

  function renderForum() {
    setHead('MOLECULAR BASE PAIRS', '(1,000,000X)');
    const posts = POSTS.map(([c, t]) => `<p class="${c}">[Student]: ${esc(t)}</p>`).join('');
    show(`<div class="pair"><div class="base pink">G</div><div class="bonds"><span></span><span></span></div><div class="base blue">C</div></div>
      <div class="pill-label">STUDENT FORUM</div>
      <div class="forum-box" id="forum"><p>Use these tabs to ask questions, find groups for projects, discuss topics.</p>${posts}</div>
      <input class="tr-input" id="post" type="text" maxlength="140" placeholder="Enter text here, then press Enter to post" aria-label="Post to the forum" autocomplete="off" />
      <div class="tr-row"><button class="tr-btn" id="cont" type="button">CONTINUE</button></div>`);
    const post = $('#post'), forum = $('#forum');
    post.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || !post.value.trim()) return;
      forum.insertAdjacentHTML('beforeend', `<p class="c4">[You]: ${esc(post.value.trim())}</p>`);
      forum.scrollTop = forum.scrollHeight;
      post.value = '';
    });
    $('#cont').onclick = next;
  }

  function fmtDate() {
    return new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  function renderCert() {
    setHead('MOLECULAR BASE PAIRS', '(1,000,000X)');
    const saved = safeGet('biotech_student_name') || '';
    show(`<div class="pair" style="max-width:520px"><div class="base pink" style="width:56px;height:56px">A</div><div class="bonds"><span></span><span></span></div><div class="base blue" style="width:56px;height:56px">T</div></div>
      <div class="cert-wrap"><div class="cert" id="cert">
        <h2>Certificate of Achievement</h2>
        <div class="certifies">This document certifies that</div>
        <input class="name" id="cname" type="text" maxlength="40" placeholder="Type your name" value="${esc(saved)}" aria-label="Name on certificate" />
        <div class="small">has successfully completed the training program</div>
        <div class="program">Industry Training: Soft Skill Building</div>
        <div class="small">Granted this ${esc(fmtDate())} &middot; ${esc(role)} pathway</div>
        <div class="cert-foot"><span>Signature</span>
          <svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="28" fill="#1b1b1b"/><circle cx="30" cy="30" r="22" fill="none" stroke="#e6e2dc" stroke-width="1.5" stroke-dasharray="3 2"/><path d="M22 18c8 6 8 18 16 24M38 18c-8 6-8 18-16 24" stroke="#e6e2dc" stroke-width="2" fill="none"/></svg>
          <span>Instructor’s Name</span></div>
      </div></div>
      <div class="tr-row"><button class="tr-btn" id="print" type="button">SAVE / PRINT PDF</button><a class="tr-btn" href="index.html">HOME</a></div>
      <p class="cta">Upload to LinkedIn or a resume to secure an internship and other opportunities using the skills learned!</p>`);
    const n = $('#cname');
    n.addEventListener('input', () => safeSet('biotech_student_name', n.value));
    $('#print').onclick = () => window.print();
    safeSet('biotech_training_complete', '1');
    if (!saved) n.focus();
  }

  function render() {
    const s = STAGES[idx];
    setExp(EXP[idx]);
    if (s === 'step3') renderStep(3);
    else if (s === 'step4') renderStep(4);
    else if (s === 'forum') renderForum();
    else if (s === 'cert') renderCert();
    else renderQuestion(+s[1]);
  }
  function next() { if (idx < STAGES.length - 1) { idx++; render(); } }

  render();
})();
</script>
<script src="helix.js"></script>
<script src="labnotebook.js"></script>
<script src="biobot.js"></script>
</body>
</html>
